server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El navegador usa /api; Nginx reenvía la petición al backend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /home { try_files /html/home.html =404; }
    location = /home.html { try_files /html/home.html =404; }
    location = /register { try_files /index.html =404; }
    location = /forgot-password { try_files /index.html =404; }

    location / {
        try_files $uri =404;
    }
}
