server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El navegador usa /api; Nginx reenvía la petición al backend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / { try_files /html/index.html =404; }
    location = /login { try_files /html/index.html =404; }
    location = /index.html { try_files /html/index.html =404; }
    location = /home {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /html/home.html =404;
    }
    location = /home.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /html/home.html =404;
    }
    location = /html/home.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /html/home.html =404;
    }
    location = /register { try_files /html/register.html =404; }
    location = /register.html { try_files /html/register.html =404; }
    location = /forgot-password { try_files /html/forgot-password.html =404; }
    location = /forgot-password.html { try_files /html/forgot-password.html =404; }

    location / {
        try_files $uri =404;
    }
}
