services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-marketplace_db}
      MYSQL_USER: ${DOCKER_DB_USER:-fivox}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-fivox_local}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DOCKER_DB_NAME:-marketplace_db}
      DB_USER: ${DOCKER_DB_USER:-fivox}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-fivox_local}
      JWT_SECRET: ${DOCKER_JWT_SECRET:-fivox-secreto-solo-para-desarrollo-local}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
